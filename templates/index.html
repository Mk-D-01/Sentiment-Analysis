<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Analysis</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #dfe2e7;
      --accent: #3b5bdb;
      --neg: #e03131; --neu: #868e96; --pos: #2f9e44;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161b; --card: #1e2128; --text: #e7e9ee; --muted: #9aa1ad; --border: #2e323b; --accent: #748ffc; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 48px 16px;
    }
    main { width: 100%; max-width: 640px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; padding: 12px; font: inherit;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; }
    .hint { color: var(--muted); font-size: .85rem; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 20px; display: none; }
    .label { font-size: 1.6rem; font-weight: 700; margin: 0 0 4px; }
    .label.Negative { color: var(--neg); } .label.Neutral { color: var(--neu); } .label.Positive { color: var(--pos); }
    .bar-row { display: grid; grid-template-columns: 80px 1fr 52px; align-items: center; gap: 10px; margin: 10px 0; }
    .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
    .fill { height: 100%; width: 0; border-radius: 5px; transition: width .4s ease; }
    .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .warn { color: #e8590c; font-size: .9rem; margin-top: 8px; }
    .error { color: var(--neg); margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Sentiment Analysis</h1>
  <p class="sub">Type a statement to see whether it is Positive, Neutral or Negative.</p>

  <div class="card">
    <textarea id="text" placeholder="e.g. I really enjoyed the lecture today!"></textarea>
    <div class="row">
      <span class="hint">Ctrl + Enter to analyze</span>
      <button id="btn">Analyze</button>
    </div>
    <div id="error" class="error"></div>

    <div id="result">
      <p id="label" class="label"></p>
      <div id="bars"></div>
      <div id="warn" class="warn"></div>
    </div>
  </div>
</main>

<script>
  const COLORS = { Negative: "var(--neg)", Neutral: "var(--neu)", Positive: "var(--pos)" };
  const textEl = document.getElementById("text");
  const btn = document.getElementById("btn");
  const errorEl = document.getElementById("error");

  async function analyze() {
    const text = textEl.value.trim();
    errorEl.textContent = "";
    if (!text) { errorEl.textContent = "Please enter a statement."; return; }

    btn.disabled = true; btn.textContent = "Analyzing...";
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      show(data);
    } catch (e) {
      errorEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Analyze";
    }
  }

  function show(data) {
    const label = document.getElementById("label");
    label.textContent = data.sentiment;
    label.className = "label " + data.sentiment;

    const bars = document.getElementById("bars");
    bars.innerHTML = "";
    for (const name of ["Positive", "Neutral", "Negative"]) {
      const pct = (data.scores[name] * 100).toFixed(1);
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `<span>${name}</span>
        <div class="track"><div class="fill" style="background:${COLORS[name]}"></div></div>
        <span class="num">${pct}%</span>`;
      bars.appendChild(row);
      requestAnimationFrame(() => row.querySelector(".fill").style.width = pct + "%");
    }

    document.getElementById("warn").textContent = data.known_words === 0
      ? "None of these words appear in the model's vocabulary, so this result is just the model's default guess."
      : "";
    document.getElementById("result").style.display = "block";
  }

  btn.addEventListener("click", analyze);
  textEl.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) analyze(); });
</script>
</body>
</html>
